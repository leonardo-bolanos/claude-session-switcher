name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Los tests son logica pura (iTerm y `claude` van mockeados), asi que corren en
    # Linux — mas rapido y gratis. La matriz cubre desde el minimo declarado (3.7)
    # hasta la version actual, porque `datetime.fromisoformat` es lo que fija el suelo.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Tests de la lógica pura
        run: python3 test_ccl.py -v

      - name: Tests del panel interactivo
        # Arrancan el panel en un pty con datos sinteticos: no necesitan iTerm ni
        # `claude`, asi que corren igual en Linux. Las esperas se duplican porque un
        # runner compartido es mas lento que una maquina de desarrollo y, si no, los
        # tests fallan sin que nada este roto.
        env:
          CCL_TEST_LENTO: "2"
        run: python3 test_panel.py

  macos:
    # Una pasada en macOS: es la unica plataforma soportada de verdad, y aqui se
    # comprueba que el script arranca y responde --list sin iTerm delante.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tests
        env:
          CCL_TEST_LENTO: "2"
        run: |
          python3 test_ccl.py
          python3 test_panel.py

      - name: El script compila y es ejecutable
        run: |
          python3 -m py_compile ccl
          test -x ccl || { echo "ccl perdio el permiso de ejecucion"; exit 1; }

      - name: install.sh tiene sintaxis valida
        run: bash -n install.sh

      - name: demo.svg esta al dia
        # Si el demo del README no coincide con lo que pinta el panel hoy, la portada
        # del repo esta mintiendo. Avisa, no falla: el demo es documentacion, no una
        # regresion. Se compara solo el TEXTO, porque el SVG entero cambia en cada
        # grabacion (posiciones en coma flotante) aunque el contenido sea identico.
        run: |
          python3 make_demo.py /tmp/demo-nuevo.svg
          python3 - <<'EOF'
          import re
          texto = lambda p: re.sub(r"<[^>]+>", "", open(p).read())
          if texto("demo.svg") == texto("/tmp/demo-nuevo.svg"):
              print("demo.svg coincide con el panel actual")
          else:
              print("::warning::demo.svg quedo desfasado: corre python3 make_demo.py")
          EOF

      - name: Degrada bien sin Claude Code instalado
        run: |
          # En el runner no existe `claude`: debe dar un error claro y salir con 1,
          # no decir "no hay sesiones activas", que mandaria a diagnosticar otra cosa.
          set +e
          out=$(./ccl --list 2>&1); code=$?
          set -e
          echo "$out"
          test $code -eq 1 || { echo "esperaba exit 1, dio $code"; exit 1; }
          echo "$out" | grep -q "no encuentro el comando" \
            || { echo "el mensaje de error no es el esperado"; exit 1; }
